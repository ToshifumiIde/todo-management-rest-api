spring.application.name=todo-management
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://todo-management-api-db:3306/todo_db
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSOWRD}
mybatis,configuration.map-underscore-to-camel-case=true

app.jwt-secret=${JWT_SECRET}
app.jet-expiration-milliseconds=${JET_EXPIRATION_MILLISECONDS}